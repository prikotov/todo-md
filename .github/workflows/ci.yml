name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - run: composer validate --strict
      - run: find bin src -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php bin/todo-md-validate .
      - run: php tests/run.php
